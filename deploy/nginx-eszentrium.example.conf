# Reverse proxy for eszentrium.wt-my-vps.eu
#
# 413 on POST /api/images/upload with a ~10 MB file means nginx is NOT using 100m —
# the default is 1m. The directive must be in the active server/location block, then reload.
#
# Verify on the VPS:
#   sudo nginx -T 2>/dev/null | grep client_max_body_size
#   curl -s https://eszentrium.wt-my-vps.eu/api/health/upload-limits
#
# Test bypassing nginx (from the VPS itself):
#   curl -F "file=@/path/to/hex_0_0.png" http://127.0.0.1:3000/api/images/upload

# Belongs in the http { } context, NOT inside server { } — put it in nginx.conf, or in a file
# under conf.d/ that is included at http level. Without it nginx refuses to start with
# "unknown \"connection_upgrade\" variable".
#
# It keeps `Connection: upgrade` on a real WebSocket handshake and `Connection: close`
# otherwise, so ordinary requests are unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name eszentrium.wt-my-vps.eu;

    # Must apply to API uploads (inheritance sometimes fails if only set in http {})
    client_max_body_size 100m;

    location /api/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Socket.IO — the Upgrade/Connection pair is what makes a WebSocket possible.
    #
    # Without them nginx answers the handshake as an ordinary request and the upgrade fails.
    # Sockets opened with transports: ['websocket'] (character sync, world sync) then never
    # connect at all and retry forever, and the ones that allow a fallback sit on HTTP
    # long-polling, i.e. a request every few seconds per client per socket, straight into
    # the Node event loop. Symptom: the whole site is intermittently slow or unreachable
    # while nobody is doing anything.
    #
    # Verify after reloading:
    #   sudo nginx -T 2>/dev/null | grep -A3 'location /socket.io'
    # and in the browser's Network tab the /socket.io/ request should report status 101
    # (Switching Protocols) instead of a stream of long-poll requests.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A live socket is idle between messages; the default 60s would cut it repeatedly.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Harmless for plain requests, and covers any socket path added later.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
