<div class="rb-root" [class.rb-root--overlay]="mode === 'overlay'">
  <div class="rb-panel">

    <!-- Header -->
    <div class="rb-header">
      <h1 class="rb-title"><span class="app-icon i-ability"></span> Regelwerk</h1>
      @if (mode === 'overlay') {
        <button class="rb-close" (click)="close.emit()" title="Schließen (Esc)">&times;</button>
      }
    </div>

    <!-- Tab bar + back -->
    <div class="rb-tabbar">
      <button class="rb-back" (click)="goBack()" [disabled]="!canGoBack()"
              title="Zurück (Alt+←)">&#8592;</button>
      <div class="rb-tabs">
        @for (p of pages(); track p.id) {
          <button class="rb-tab" [class.active]="p.id === activeId()" (click)="onTabClick(p.id)">
            @if (p.icon) { <span [class]="'app-icon i-' + p.icon"></span> }
            {{ p.tab }}
          </button>
        }
      </div>
    </div>

    <!-- Content -->
    <div class="rb-content" #scroller (click)="onContentClick($event)">
      @if (fatal()) {
        <div class="rb-error">
          <p>{{ fatal() }}</p>
          <p class="rb-error-hint">
            Liegt eine <code>index.json</code> in <code>public/rulebook/</code>?
            Erzeuge sie mit <code>npm run rulebook:manifest</code>.
          </p>
        </div>
      } @else if (loading()) {
        <div class="rb-loading"><span class="rb-spinner"></span> Wird geladen …</div>
      } @else if (error()) {
        <div class="rb-error">
          <p>{{ error() }}</p>
          <button class="rb-retry" (click)="retry()">Erneut versuchen</button>
        </div>
      } @else {
        <article class="rb-article" [innerHTML]="html()"></article>
      }
    </div>

  </div>
</div>
