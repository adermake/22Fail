<div class="stat-card">
  <div class="stat-header">{{name}}</div>

  <div class="stat-row">
    <div class="stat-bar-wrapper">
      <div
        class="stat-bar-fill"
        [class]="barClass"
        [style.width.%]="(current / statusMax) * 100">
      </div>
    </div>
    <span class="stat-max" [title]="maxBreakdown">/ {{ statusMax }}</span>
  </div>

  <!-- Inputs -->
  <div class="stat-inputs">
    <div class="stat-input-group">
      <label>Aktuell</label>
      <input type="number" [(ngModel)]="current" (ngModelChange)="updateCurrent('statusCurrent', $event)"/>
    </div>


  </div>

  <div class="stat-inputs">
    <div class="stat-input-group">
      <label>Basis</label>
      <input type="number"  [(ngModel)]="base" (ngModelChange)="updateBase('statusBase', $event)"/>
    </div>

    <div class="stat-input-group">
      <label>Bonus</label>
      <input type="number"  [(ngModel)]="bonus"(ngModelChange)="updateBonus('statusBonus', $event)"/>
    </div>

    <div class="stat-input-group">
      <label class="effect-label" [title]="effectSources.join('\n')">Effekt</label>
      <div class="effect-value" [title]="effectSources.join('\n')">{{ effectBonus }}</div>
    </div>

    <!-- Attribut (KON/GES/INT × 5) and, for Leben, the flat gain per level -->
    <div class="stat-input-group">
      <label class="effect-label" [title]="maxBreakdown">Attribut</label>
      <div class="effect-value" [title]="maxBreakdown">{{ statBonus }}</div>
    </div>

    @if (levelBonus) {
      <div class="stat-input-group">
        <label class="effect-label" title="Jede Stufe gibt 2 Leben">Level</label>
        <div class="effect-value effect-level" title="Jede Stufe gibt 2 Leben">{{ levelBonus }}</div>
      </div>
    }
  </div>
</div>
