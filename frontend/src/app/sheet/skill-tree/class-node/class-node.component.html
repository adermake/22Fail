<div
  class="class-node"
  [class.selected]="isSelected"
  [class.accessible]="isAccessible"
  [class.complete]="isComplete"
  [class.locked]="!canLearn"
  [class.edit-mode]="editMode"
  [class.is-primary]="isPrimary"
  [class.is-secondary]="isSecondary"
  [class.on-primary-path]="onPath === 'primary'"
  [class.on-secondary-path]="onPath === 'secondary'"
  [class.mastery-pending]="masteryPending"
  [class.mastered]="mastered"
  [class.gm-unlocked]="gmUnlocked"
  [class]="tierClass"
  [style.left.px]="x"
  [style.top.px]="y"
  [style.borderColor]="tierColor"
  (click)="onClick()"
  (mousedown)="onMouseDown($event)"
>
  @if (isPrimary) {
    <div class="class-badge primary">P</div>
  }
  @if (isSecondary) {
    <div class="class-badge secondary">S</div>
  }
  @if (mastered) {
    <div class="class-badge mastery" [class.confirmed]="masteryConfirmed"
         [title]="masteryConfirmed ? 'Veredelung abgeschlossen' : 'Gemeistert — Veredelung offen'">V</div>
  }
  @if (plannedCount > 0) {
    <div class="class-badge planned" [title]="plannedCount + ' geplante Fähigkeit(en)'">{{ plannedCount }}</div>
  }
  @if (gmUnlocked) {
    <div class="class-badge gm" title="Vom GM freigeschaltet">GM</div>
  }
  <div class="node-content">
    <span class="class-name">{{ className }}</span>
    @if (totalCount > 0) {
      <span class="skill-count">{{ learnedCount }}/{{ totalCount }}</span>
    }
  </div>

  <!-- Progress ring -->
  @if (totalCount > 0) {
    <svg class="progress-ring" viewBox="0 0 100 100">
      <circle
        class="progress-bg"
        cx="50" cy="50" r="46"
        fill="none"
        stroke-width="4"
      />
      <circle
        class="progress-fill"
        cx="50" cy="50" r="46"
        fill="none"
        stroke-width="4"
        [style.stroke]="tierColor"
        [style.strokeDasharray]="'289'"
        [style.strokeDashoffset]="289 - (289 * progress / 100)"
      />
    </svg>
  }
</div>
